aid: meso
name: Meso
description: >-
  Meso is payment infrastructure designed for crypto. Backed by Ribbit Capital,
  the company is positioned as a payments-rails provider for the cryptocurrency
  sector. As of this enrichment pass its public web presence is a single-page
  marketing site at meso.network with no publicly documented developer portal,
  API reference, or OpenAPI definition surfaced yet. The one machine-readable
  artifact the company publishes is a PGP-signed RFC 9116 security.txt at
  /.well-known/security.txt declaring a security contact and disclosure policy.
  This profile was added to the API Evangelist network as a Ribbit Capital
  portfolio lead and is tracked for future API surface as the product launches.
